<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Đánh giá Chan Chan Spa trên Google Maps</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 16px; margin: 0; background: #f9f9f9; color: #333; }
        h3 { margin-bottom: 8px; }
        .hint { max-width: 360px; margin: 0 auto 28px; line-height: 1.5; color: #555; }
        .btn { display: inline-block; background: #4285F4; color: #fff; text-decoration: none; font-size: 18px; font-weight: bold; padding: 16px 28px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
        .btn:active { background: #3367D6; }
        .fallback { margin-top: 28px; font-size: 14px; color: #777; }
        .fallback a { color: #4285F4; }
    </style>
</head>
<body>
    <h3>Cảm ơn quý khách đã ghé Chan Chan Spa!</h3>
    <p class="hint" id="hint">Bấm nút bên dưới để mở Google Maps và để lại đánh giá.</p>
    <a class="btn" id="open-app" href="https://g.page/r/CSPskZXuxpzqEBM/review">⭐ Đánh giá trên Google Maps</a>
    <p class="fallback">Không mở được ứng dụng? <a href="https://g.page/r/CSPskZXuxpzqEBM/review">Đánh giá trên trình duyệt</a></p>

    <script>
        const WEB_REVIEW = "https://g.page/r/CSPskZXuxpzqEBM/review";

        // Link địa điểm đã thử mở thẳng app Google Maps (!12e1 = mở khung viết đánh giá).
        const PLACE_PATH = "www.google.com/maps/place//@10.721057,106.6345534,17z/data=!3m1!4b1!4m3!3m2!1s0x31752f006a4f4135:0xea9cc6ee9591ec23!12e1?entry=ttu&g_ep=EgoyMDI2MDkyOC4wIKXMDSoASAFQAw%3D%3D";
        const PLACE_URL = "https://" + PLACE_PATH;

        // Android: ép mở bằng app Google Maps; chưa cài app thì Chrome tự chuyển sang form đánh giá trên web.
        // Phải để khách tự bấm: Chrome chặn intent:// khi không có thao tác người dùng và sẽ nhảy sang fallback.
        const ANDROID_APP = "intent://" + PLACE_PATH +
            "#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" +
            encodeURIComponent(WEB_REVIEW) + ";end";

        // iOS trong Zalo/Facebook/Messenger...: trình duyệt nhúng không mở universal link, dùng scheme riêng của app.
        const IOS_APP_SCHEME = "comgooglemapsurl://" + PLACE_PATH;

        const ua = navigator.userAgent;
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isInAppBrowser = /Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|TikTok/i.test(ua);
        const btn = document.getElementById("open-app");

        if (isAndroid) {
            btn.href = ANDROID_APP;
        } else if (isIOS && isInAppBrowser) {
            btn.href = IOS_APP_SCHEME;
            btn.addEventListener("click", function () {
                // Máy chưa cài Google Maps: scheme không mở được gì, trang vẫn hiện -> chuyển sang form web.
                const timer = setTimeout(function () {
                    if (!document.hidden) window.location.href = WEB_REVIEW;
                }, 2000);
                document.addEventListener("visibilitychange", function () {
                    if (document.hidden) clearTimeout(timer);
                }, { once: true });
            });
        } else if (isIOS) {
            // Safari/Chrome: universal link mở app nếu đã cài, chưa cài thì mở Google Maps trên web, không báo lỗi.
            btn.href = PLACE_URL;
        } else {
            // Máy tính: form đánh giá trên web dùng tốt, chuyển luôn.
            window.location.replace(WEB_REVIEW);
        }
    </script>
</body>
</html>
