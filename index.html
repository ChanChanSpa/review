<!DOCTYPE html>
<html lang="vi">

    <script>
        // Link đánh giá chính chủ của Google (g.page) -> mở thẳng form viết đánh giá của địa điểm.
        // Dùng replace() để nút Back không quay lại trang chuyển hướng này.
        window.location.replace("https://g.page/r/CSPskZXuxpzqEBM/review");
    </script>
</body>
